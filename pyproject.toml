[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ariadne-code"
version = "0.4.0"
description = "A minimal, read-first AI agent for understanding codebases, with a terminal REPL and a browser UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Zhang Weiqi", email = "vdsfsdtest@datavolt.biz" },
]
maintainers = [
    { name = "Zhang Weiqi", email = "vdsfsdtest@datavolt.biz" },
]
keywords = ["ai", "agent", "code-reading", "code-review", "cli", "web-ui", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ariadne_code", "server"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
rag = [
    "fastembed>=0.4",
    "numpy>=1.24",
]
dev = [
    "ariadne[server,rag]",
    "pytest>=7.0",
    "httpx>=0.27",
    # pinned: ruff's default rule set widens between releases, and an
    # unpinned lint job turns red on code nobody touched
    "ruff==0.16.6",
]

[project.scripts]
ariadne = "ariadne_code.cli:main"
ariadne-server = "server.main:main"
ariadne-index = "ariadne_code.index_cli:main"

[project.urls]
Homepage = "https://github.com/signfff/Ariadne"
Repository = "https://github.com/signfff/Ariadne"
Issues = "https://github.com/signfff/Ariadne/issues"

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
# Chosen explicitly: relying on ruff's defaults means the enabled set silently
# changes on upgrade.
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    # Tools deliberately catch everything and hand the message back to the
    # model as text - a crashing tool would end the run instead.
    "BLE001",
    # Tool subclasses declare `parameters` as a plain class attribute; that is
    # the schema declaration, not accidental shared state.
    "RUF012",
    # User-facing strings are Chinese; full-width punctuation is correct there,
    # not an ambiguous-character mistake.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]  # bare attribute access is how a lazy property gets forced
