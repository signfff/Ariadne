[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corecoder"
version = "0.4.0"
description = "A minimal, read-first AI agent for understanding codebases, with a terminal REPL and a browser UI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Yufeng He", email = "40085740+he-yufeng@users.noreply.github.com" },
]
keywords = ["ai", "agent", "code-reading", "code-review", "cli", "web-ui", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Terminals",
]
dependencies = [
    "openai>=1.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "python-dotenv>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["corecoder", "server"]

[project.optional-dependencies]
litellm = ["litellm>=1.60.0,<2.0.0"]
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]
dev = ["pytest>=7.0", "ruff>=0.9.0", "httpx>=0.27"]

[project.scripts]
corecoder = "corecoder.cli:main"
corecoder-web = "corecoder.web:main"
corecoder-server = "server.main:main"

[project.urls]
Homepage = "https://github.com/he-yufeng/CoreCoder"
Repository = "https://github.com/he-yufeng/CoreCoder"
Issues = "https://github.com/he-yufeng/CoreCoder/issues"

[tool.ruff]
line-length = 130
target-version = "py310"
